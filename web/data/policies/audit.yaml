# Audit policy: same rules as default, but nothing is blocked; everything is
# recorded and anything outside the rules is flagged.
version: 1
name: audit
mode: audit
filesystem:
  read:
    - /usr
    - /lib
    - /bin
    - /sbin
    - /etc
    - /proc
    - /sys
    - /opt
    - ${HOME}/.gitconfig
  write:
    - ${WORKSPACE}
    - /tmp
    - /dev
    - ${HOME}/.cache
    - ${HOME}/.npm
    - ${HOME}/.local
    - ${HOME}/.config/git
    - ${HOME}/.codex
network:
  allow_hosts:
    - pypi.org
    - files.pythonhosted.org
    - registry.npmjs.org
    - github.com
    - codeload.github.com
    - objects.githubusercontent.com
exec:
  flag:
    - curl
    - wget
    - nc
    - ncat
    - ssh
    - scp
